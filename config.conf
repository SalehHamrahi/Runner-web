#mode=major/starter
fullstate=true

#synch_mode=true/false
synch_mode=true

#type=round_robin/stepladder
type=stepladder

#extra_halfs used by stepladder matches
nr_extra_halfs=2

#penalty_shoot_outs=true/false
penalty_shoot_outs=false

#INFO/DEBUG/WARNING/ERROR/CRITICAL
log_level=INFO

# match data match data extraction
data_collection=true
spatial_grid_x=15
spatial_grid_y=9
analytics_enabled=true

# Discord notifications
# Keep the webhook URL out of git; RUNNER_DISCORD_WEBHOOK_URL takes precedence.
discord_enabled=false
discord_webhook_url=
discord_username=Runner
notify_match_finished=true
notify_tournament_finished=true
notify_team_crash=true
notify_server_crash=true

# Plugins
plugins_enabled=false
plugins_dir=plugins
